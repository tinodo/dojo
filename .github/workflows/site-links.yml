name: site-links

# Once a week: the addresses on learn.microsoft.com and docs.github.com that the project site links to still answer
# (website/check_links.py, ADR 0027). Microsoft moves exam pages and study guides now and then, and nothing in the
# repository would notice. A failed run is mailed to the owner like any failed workflow.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the site
        run: python website/build.py --out _site
      - name: Check the external addresses
        run: python website/check_links.py _site
